name: PoB engine

# Builds LuaJIT and lua-utf8 from pinned sources, checks out a pinned Path of Building PoE2
# (without art), runs it headless as a self-test, and uploads the engine/ folder that the
# extension bundle ships.

on:
  workflow_dispatch:
  workflow_call:
  push:
    paths:
      - "pob/**"
      - ".github/workflows/pob-engine.yml"

permissions:
  contents: read

env:
  # LuaJIT v2.1 at the commit Path of Building itself pins; it supports PoB's newer syntax.
  LUAJIT_COMMIT: 2460b3ff93a1c955de3d62cfc825de7d68dc272e
  LUAUTF8_COMMIT: d65ebfa4a00d6e582970ab729013bb2a629e74c9
  # Path of Building PoE2 dev with 0.5.5 game data.
  POB_COMMIT: ce566eac45ea8a86477f513c7ee65a1ebe60014e

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: git make mingw-w64-ucrt-x86_64-gcc

      - name: Build LuaJIT and lua-utf8
        shell: msys2 {0}
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/LuaJIT/LuaJIT lj
          git -C lj checkout "$LUAJIT_COMMIT"
          make -C lj -j4
          git clone --filter=blob:none https://github.com/starwing/luautf8 lu
          git -C lu checkout "$LUAUTF8_COMMIT"
          gcc -O2 -shared -static-libgcc -DLUA_BUILD_AS_DLL -Ilj/src lu/lutf8lib.c lj/src/lua51.dll -o lua-utf8.dll
          mkdir -p engine/runtime engine/licenses
          cp lj/src/luajit.exe lj/src/lua51.dll lua-utf8.dll engine/runtime/
          cp lj/COPYRIGHT engine/licenses/LuaJIT-COPYRIGHT.txt
          cp lu/LICENSE engine/licenses/lua-utf8-LICENSE.txt 2>/dev/null || cp lu/README.md engine/licenses/lua-utf8-README.md
          ./engine/runtime/luajit.exe -v

      - name: Check out Path of Building (no art)
        shell: bash
        env:
          # Stop Git Bash rewriting '/src/'-style patterns into Windows paths.
          MSYS_NO_PATHCONV: "1"
        run: |
          set -euo pipefail
          git config --global core.autocrlf false
          git clone --filter=blob:none --no-checkout https://github.com/PathOfBuildingCommunity/PathOfBuilding-PoE2 pob-src
          git -C pob-src sparse-checkout set --no-cone '/src/' '/runtime/lua/' '/LICENSE.md' '!*.zst' '!*.png' '!*.jpg' '!*.dds' '!*.webp' '!/src/Export/'
          git -C pob-src checkout "$POB_COMMIT"
          mkdir -p engine/pob
          cp -r pob-src/src engine/pob/src
          mkdir -p engine/pob/runtime && cp -r pob-src/runtime/lua engine/pob/runtime/lua
          cp pob-src/LICENSE.md engine/licenses/PathOfBuilding-LICENSE.md
          cp pob/host.lua engine/host.lua
          echo "$POB_COMMIT" > engine/pob/COMMIT
          du -sh engine engine/pob/src

      - name: Run PoB headless self-test
        shell: bash
        run: |
          set -euo pipefail
          cd engine/pob/src
          ../../runtime/luajit.exe ../../host.lua selftest > "$GITHUB_WORKSPACE/selftest.json" 2> "$GITHUB_WORKSPACE/selftest.log" || true
          echo "--- stdout"; cat "$GITHUB_WORKSPACE/selftest.json"
          echo "--- last 20 lines of stderr"; tail -n 20 "$GITHUB_WORKSPACE/selftest.log"
          node -e "
            const lines = require('fs').readFileSync(process.env.GITHUB_WORKSPACE + '/selftest.json', 'utf8').trim().split(/\r?\n/);
            const r = JSON.parse(lines[lines.length - 1]);
            if (!r.ok || !r.result || !r.result.stats || !(r.result.stats.Life > 0) || !(r.result.stats.TotalDPS > 0)) {
              console.error('Self-test failed:', JSON.stringify(r)); process.exit(1);
            }
            console.log('Self-test OK:', JSON.stringify({ life: r.result.stats.Life, dps: r.result.stats.TotalDPS, startup: r.startupSeconds }));
          "

      - uses: actions/upload-artifact@v4
        with:
          name: engine-windows
          path: engine/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-logs
          path: |
            selftest.json
            selftest.log
          if-no-files-found: warn
